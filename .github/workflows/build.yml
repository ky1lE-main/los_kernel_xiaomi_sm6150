name: Build Agni 1.9 + namespaces

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # CHANGE THIS if your repo's sweet defconfig is named differently
      # (check arch/arm64/configs/ and arch/arm64/configs/vendor/)
      DEFCONFIG: vendor/sweet_defconfig
    steps:
      - name: Checkout kernel source (Agni 1.9 commit)
        uses: actions/checkout@v4
        with:
          ref: 54dde6839c08907860bdcc8b69eab72c75f17319
          fetch-depth: 1
          submodules: recursive

      - name: Where is KernelSU in this source? (diagnostics)
        run: |
          echo "== root =="; ls
          echo "== gitmodules =="; cat .gitmodules 2>&1 | head -20
          echo "== tracked ksu files =="; git ls-files | grep -i -E "ksu|kernelsu|susfs" | head -30
          echo "== find ksu dirs =="; find . -maxdepth 4 \( -iname "*kernelsu*" -o -iname "*ksu*" \) -not -path "./.git/*" | head -30
          echo "== hooks in Makefile/Kconfig =="
          grep -n -i -E "ksu|kernelsu" Makefile drivers/Makefile drivers/Kconfig fs/Makefile fs/Kconfig 2>&1 | head -30
          echo "== recent commits =="; git log --oneline -8

      - name: Fetch agni_base.config.gz from the workflow commit
        run: |
          git fetch --depth=1 origin ${{ github.sha }}
          git show FETCH_HEAD:agni_base.config.gz > agni_base.config.gz
          ls -l agni_base.config.gz

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip curl xz-utils lld ccache python3 device-tree-compiler patchelf zstd wget

      - name: Get Neutron Clang
        run: |
          mkdir -p $HOME/clang && cd $HOME/clang
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) --patch=glibc
          echo "$HOME/clang/bin" >> $GITHUB_PATH
          $HOME/clang/bin/clang --version

      - name: Configure (running Agni config + namespace options)
        run: |
          export ARCH=arm64
          if [ -f agni_base.config.gz ]; then
            mkdir -p out
            zcat agni_base.config.gz > out/.config
            make O=out CC=clang LD=ld.lld olddefconfig
          else
            echo "agni_base.config.gz missing in repo root" ; exit 1
          fi
          scripts/config --file out/.config \
            -e NAMESPACES -e UTS_NS -e PID_NS \
            -e SYSVIPC -e SYSVIPC_SYSCTL -e IPC_NS \
            -e USER_NS -e DEVTMPFS -e DEVTMPFS_MOUNT
          make O=out CC=clang LD=ld.lld olddefconfig
          echo "---- KSU diagnostics ----"
          echo "input had:"; zcat agni_base.config.gz | grep -E "^CONFIG_KSU=" || true
          echo "output has:"; grep -E "KSU" out/.config | head -5 || true
          ls -la drivers/ | grep -i -E "kernelsu|ksu" || echo "no drivers/kernelsu entry"
          ls drivers/kernelsu 2>&1 | head -5
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile || true
          grep -n -A12 "^config KSU$" drivers/kernelsu/Kconfig 2>&1 | head -20
          echo "---- verify ----"
          grep -E "CONFIG_(NAMESPACES|UTS_NS|PID_NS|SYSVIPC|IPC_NS|USER_NS|DEVTMPFS|KSU|KSU_SUSFS)=" out/.config
          for o in KSU KSU_SUSFS PID_NS IPC_NS; do
            grep -q "^CONFIG_$o=y" out/.config || { echo "MISSING $o"; exit 1; }
          done

      - name: Build
        shell: bash
        run: |
          export ARCH=arm64
          make -j$(nproc) O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: Copy config for artifact
        run: cp out/.config out/config-used.txt

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: agni-ns-kernel
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
            out/config-used.txt
            build.log
            
