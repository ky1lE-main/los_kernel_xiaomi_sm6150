
name: Build Agni 1.9 + namespaces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Agni 1.9 source
        uses: actions/checkout@v4
        with:
          repository: manipvlator/los_kernel_xiaomi_sm6150
          ref: 54dde6839c08907860bdcc8b69eab72c75f17319
          path: kernel
          fetch-depth: 1
          submodules: recursive

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          path: workflow
          ref: ${{ github.sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            cpio zip curl xz-utils lld ccache \
            python3 device-tree-compiler patchelf \
            zstd wget build-essential

      - name: Install Neutron Clang
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          curl -LSs \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman
          bash antman -S
          bash antman --patch=glibc
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version

      - name: Integrate KernelSU Next
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh legacy

          echo "=== KernelSU files ==="
          find . -maxdepth 4 \
            \( -iname '*kernelsu*' -o -iname '*ksu*' \) \
            -not -path './.git/*' -print | head -80

      - name: Configure namespaces and KernelSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1

          test -f ../workflow/agni_base.config.gz

          mkdir -p out
          zcat ../workflow/agni_base.config.gz > out/.config

          make O=out CC=clang LD=ld.lld olddefconfig

          scripts/config --file out/.config \
            -e NAMESPACES \
            -e UTS_NS \
            -e PID_NS \
            -e SYSVIPC \
            -e IPC_NS \
            -e USER_NS \
            -e DEVTMPFS \
            -e DEVTMPFS_MOUNT \
            -e KPROBES \
            -e KPROBE_EVENTS \
            -e KSU_KPROBE_HOOKS \
            -e KSU

          make O=out CC=clang LD=ld.lld olddefconfig

          echo "=== Verify configuration ==="
          grep -E '^CONFIG_(NAMESPACES|UTS_NS|PID_NS|SYSVIPC|IPC_NS|USER_NS|DEVTMPFS|DEVTMPFS_MOUNT|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS|KSU)=' out/.config || true

          for option in NAMESPACES UTS_NS PID_NS SYSVIPC IPC_NS KSU; do
            if ! grep -q "^CONFIG_${option}=y$" out/.config; then
              echo "ERROR: CONFIG_${option} is not enabled."
              exit 1
            fi
          done

          cp out/.config out/config-used.txt

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail
          export ARCH=arm64
          export LLVM=1

          make -j"$(nproc)" O=out \
            CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            2>&1 | tee out/build.log

      - name: Verify kernel image
        working-directory: kernel
        shell: bash
        run: |
          set -e
          echo "=== Kernel output ==="
          find out/arch/arm64/boot -maxdepth 2 -type f -ls
          test -s out/arch/arm64/boot/Image

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agni-ns-build
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/config-used.txt
            kernel/out/build.log
          if-no-files-found: error
          
