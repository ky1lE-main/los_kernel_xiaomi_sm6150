
name: Diagnose Agni KernelSU Next Hooks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Agni kernel source
        uses: actions/checkout@v4
        with:
          repository: manipvlator/los_kernel_xiaomi_sm6150
          ref: 54dde6839c08907860bdcc8b69eab72c75f17319
          path: kernel
          fetch-depth: 1

      - name: Checkout repository base config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: config-repo
          sparse-checkout: |
            agni_base.config.gz
          sparse-checkout-cone-mode: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            cpio zip curl xz-utils lld python3 git

      - name: Install Neutron Clang
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) --patch=glibc
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Verify and copy base config
        run: |
          set -e
          test -s config-repo/agni_base.config.gz
          gzip -t config-repo/agni_base.config.gz
          cp config-repo/agni_base.config.gz kernel/agni_base.config.gz

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          set -e
          curl -fsSL \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh legacy
          test -f drivers/kernelsu/Kbuild
          echo "KernelSU Next integration files found."

      - name: Configure and diagnose hooks
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld

          mkdir -p out
          zcat agni_base.config.gz > out/.config

          scripts/config --file out/.config \
            -e MODULES \
            -e NAMESPACES \
            -e UTS_NS \
            -e PID_NS \
            -e SYSVIPC \
            -e IPC_NS \
            -e USER_NS \
            -e DEVTMPFS \
            -e DEVTMPFS_MOUNT \
            -e KPROBES \
            -e KRETPROBES \
            -e KPROBE_EVENTS \
            -e KSU \
            -e KSU_KPROBES_HOOK \
            -d KSU_MANUAL_HOOK \
            -d KSU_SYSCALL_TABLE_HOOK

          make O=out CC=clang LD=ld.lld olddefconfig

          echo "===== Namespace configuration ====="
          grep -E '^(CONFIG_(NAMESPACES|UTS_NS|PID_NS|SYSVIPC|IPC_NS|USER_NS|DEVTMPFS|DEVTMPFS_MOUNT)=|# CONFIG_(NAMESPACES|PID_NS|IPC_NS|USER_NS) is not set)' out/.config || true

          echo "===== KernelSU and hook configuration ====="
          grep -E '^(CONFIG_(KSU|KSU_[A-Z0-9_]*HOOK[A-Z0-9_]*|KPROBES|KRETPROBES|KPROBE_EVENTS|HAVE_SYSCALL_TRACEPOINTS)=|# CONFIG_(KSU_[A-Z0-9_]*HOOK[A-Z0-9_]*|KPROBES|KRETPROBES) is not set)' out/.config || true

          echo "===== Hook prerequisites ====="
          grep -E 'KPROBES|KRETPROBES|HAVE_SYSCALL_TRACEPOINTS|KSU_KPROBES_HOOK|KSU_MANUAL_HOOK|KSU_SYSCALL_TABLE_HOOK' out/.config || true

          echo "===== KernelSU Kbuild hook-selection logic ====="
          grep -n -A35 -B5 'Checks hooks state' drivers/kernelsu/Kbuild || true

          echo "===== Config values in out/.config ====="
          grep -E '^(CONFIG_KSU_KPROBES_HOOK|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SYSCALL_TABLE_HOOK)=' out/.config || true

          echo "===== Config values in out/include/config/auto.conf ====="
          if test -f out/include/config/auto.conf; then
            grep -E '^(CONFIG_KSU_KPROBES_HOOK|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SYSCALL_TABLE_HOOK)=' out/include/config/auto.conf || true
          else
            echo "auto.conf was not generated."
          fi

          echo "===== Diagnostic complete; no kernel image built ====="

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-hook-diagnostics
          path: |
            kernel/out/.config
            kernel/out/include/config/auto.conf
            kernel/drivers/kernelsu/Kbuild
          if-no-files-found: warn
          
