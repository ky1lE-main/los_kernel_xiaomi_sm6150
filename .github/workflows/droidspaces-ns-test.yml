name: Droidspaces Namespace Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sweet namespace test
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 1

      - name: Record source revision
        run: |
          set -euxo pipefail
          echo "===== Kernel source revision ====="
          git log -1 --format='%H%n%s'
          echo "===== Kernel source status ====="
          git status --short

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lld make perl \
            python3 zip unzip xz-utils

      - name: Install NoMount
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

      - name: Install Neutron Clang
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Install cross compilers
        run: |
          set -euxo pipefail
          git clone --depth=1 -b main https://github.com/greenforce-project/gcc-arm64 gcc64
          git clone --depth=1 -b main https://github.com/greenforce-project/gcc-arm gcc32
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> "$GITHUB_PATH"

      - name: Integrate KernelSU Next
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh legacy
          test -f drivers/kernelsu/Kbuild
          grep -q 'CONFIG_KSU_KPROBES_HOOK' drivers/kernelsu/Kbuild

      - name: Configure kernel namespaces and hooks
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH=arm64

          make O=out ARCH=arm64 vendor/sweet_defconfig

          scripts/config --file out/.config \
            --enable NAMESPACES \
            --enable UTS_NS \
            --enable PID_NS \
            --enable SYSVIPC \
            --enable IPC_NS \
            --enable USER_NS \
            --enable NET_NS \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable KPROBE_EVENTS \
            --enable KSU \
            --enable KSU_KPROBES_HOOK \
            --disable KSU_MANUAL_HOOK \
            --disable KSU_SYSCALL_TABLE_HOOK

          make O=out ARCH=arm64 olddefconfig

          echo "===== Effective kernel configuration ====="
          grep -E '^(CONFIG_(NAMESPACES|UTS_NS|PID_NS|SYSVIPC|IPC_NS|USER_NS|NET_NS|DEVTMPFS|DEVTMPFS_MOUNT|KPROBES|KRETPROBES|KPROBE_EVENTS|KSU|KSU_KPROBES_HOOK|HAVE_SYSCALL_TRACEPOINTS)=|# CONFIG_(NAMESPACES|PID_NS|IPC_NS|KRETPROBES|KSU_KPROBES_HOOK) is not set)' out/.config || true

          for option in \
            CONFIG_NAMESPACES \
            CONFIG_PID_NS \
            CONFIG_IPC_NS \
            CONFIG_SYSVIPC \
            CONFIG_KPROBES \
            CONFIG_KRETPROBES \
            CONFIG_KSU \
            CONFIG_KSU_KPROBES_HOOK; do
            if ! grep -qx "${option}=y" out/.config; then
              echo "ERROR: required option is not enabled: ${option}"
              exit 1
            fi
          done

      - name: Build kernel
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export PATH="$HOME/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export KBUILD_BUILD_USER=NamespaceTest
          export KBUILD_BUILD_HOST=GitHubActions

          make -j"$(nproc)" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-elf- \
            CROSS_COMPILE_ARM32=arm-eabi-

          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dtbo.img
          test -s out/arch/arm64/boot/dtb.img

      - name: Package AnyKernel3 ZIP
        run: |
          set -euxo pipefail
          git clone --depth=1 -b reforge https://github.com/manipvlator/Anykernel3.git AnyKernel3

          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cp out/arch/arm64/boot/dtb.img AnyKernel3/

          cd AnyKernel3
          zip -r "$GITHUB_WORKSPACE/droidspaces-namespace-test.zip" . -x '.git/*'

      - name: Upload test ZIP and config
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-namespace-test
          path: |
            droidspaces-namespace-test.zip
            out/.config
          if-no-files-found: error
          
