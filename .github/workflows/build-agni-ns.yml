
name: Build Agni 1.9 + KernelSU Next + Namespaces

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Agni kernel source
        uses: actions/checkout@v4
        with:
          repository: manipvlator/los_kernel_xiaomi_sm6150
          ref: 54dde6839c08907860bdcc8b69eab72c75f17319
          path: kernel
          fetch-depth: 1

      - name: Checkout config from my fork
        uses: actions/checkout@v4
        with:
          repository: ky1IE-main/los_kernel_xiaomi_sm6150
          ref: stable
          path: config-repo
          sparse-checkout: |
            agni_base.config.gz
          sparse-checkout-cone-mode: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            cpio zip curl xz-utils lld ccache \
            python3 device-tree-compiler patchelf \
            zstd wget git

      - name: Install Neutron Clang
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) --patch=glibc
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version

      - name: Verify and copy base config
        run: |
          set -e
          test -s config-repo/agni_base.config.gz
          gzip -t config-repo/agni_base.config.gz
          cp config-repo/agni_base.config.gz kernel/agni_base.config.gz
          echo "Base config downloaded and verified."

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          set -e
          curl -fsSL \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh legacy

          test -d KernelSU-Next || {
            echo "ERROR: KernelSU Next source directory not found."
            exit 1
          }

          test -f drivers/kernelsu/Kbuild || {
            echo "ERROR: KernelSU Kbuild integration was not created."
            exit 1
          }

      - name: Configure namespaces and KSU hooks
        working-directory: kernel
        shell: bash
        run: |
          set -e
          export ARCH=arm64
          export CC=clang
          export LD=ld.lld

          mkdir -p out
          zcat agni_base.config.gz > out/.config

          scripts/config --file out/.config \
            -e MODULES \
            -e NAMESPACES \
            -e UTS_NS \
            -e PID_NS \
            -e SYSVIPC \
            -e IPC_NS \
            -e USER_NS \
            -e DEVTMPFS \
            -e DEVTMPFS_MOUNT \
            -e KPROBES \
            -e KPROBE_EVENTS \
            -e KSU_KPROBE_HOOKS \
            -e KSU

          make O=out CC=clang LD=ld.lld olddefconfig

          echo "===== Effective configuration ====="
          grep -E '^CONFIG_(MODULES|NAMESPACES|UTS_NS|PID_NS|SYSVIPC|IPC_NS|USER_NS|DEVTMPFS|DEVTMPFS_MOUNT|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS|KSU|KSU_SUSFS)=' out/.config || true

          echo "===== Required namespace checks ====="
          for opt in NAMESPACES UTS_NS PID_NS SYSVIPC IPC_NS; do
            if grep -q "^CONFIG_${opt}=y$" out/.config; then
              echo "OK: CONFIG_${opt}=y"
            else
              echo "ERROR: CONFIG_${opt} is missing."
              exit 1
            fi
          done

          grep -q '^CONFIG_KSU=y$' out/.config || {
            echo "ERROR: KernelSU is not enabled."
            exit 1
          }

          if ! grep -q '^CONFIG_KPROBES=y$' out/.config ||
             ! grep -q '^CONFIG_KPROBE_EVENTS=y$' out/.config ||
             ! grep -q '^CONFIG_KSU_KPROBE_HOOKS=y$'; then
            echo "ERROR: Automatic KernelSU hooks are not fully configured."
            echo "Inspect the configuration output before proceeding."
            exit 1
          fi

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail
          export ARCH=arm64
          make -j"$(nproc)" O=out \
            CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: Verify build output
        working-directory: kernel
        run: |
          set -e
          test -s out/arch/arm64/boot/Image
          cp out/.config out/config-used.txt
          echo "Kernel Image successfully produced."

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agni-ns-kernel-diagnostics
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/config-used.txt
            kernel/build.log
          if-no-files-found: warn
          
