
name: Build Agni 1.9 + KernelSU Next + Namespaces

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Agni kernel source
        uses: actions/checkout@v4
        with:
          repository: manipvlator/los_kernel_xiaomi_sm6150
          ref: 54dde6839c08907860bdcc8b69eab72c75f17319
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            cpio zip curl xz-utils lld ccache \
            python3 device-tree-compiler patchelf \
            zstd wget git

      - name: Install Neutron Clang
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) --patch=glibc
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version

      - name: Integrate KernelSU Next
        run: |
          set -e
          curl -fsSL \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh legacy

          test -d KernelSU-Next || {
            echo "ERROR: KernelSU Next source directory not found."
            exit 1
          }

          test -f drivers/kernelsu/Kbuild || {
            echo "ERROR: KernelSU Kbuild integration was not created."
            exit 1
          }

      - name: Configure namespaces and KSU hooks
        shell: bash
        run: |
          set -e
          export ARCH=arm64
          export CC=clang
          export LD=ld.lld

          if [ ! -f agni_base.config.gz ]; then
            echo "ERROR: agni_base.config.gz is missing."
            exit 1
          fi

          mkdir -p out
          zcat agni_base.config.gz > out/.config

          scripts/config --file out/.config \
            -e MODULES \
            -e NAMESPACES \
            -e UTS_NS \
            -e PID_NS \
            -e SYSVIPC \
            -e IPC_NS \
            -e USER_NS \
            -e DEVTMPFS \
            -e DEVTMPFS_MOUNT \
            -e KPROBES \
            -e KPROBE_EVENTS \
            -e KSU_KPROBE_HOOKS \
            -e KSU

          make O=out CC=clang LD=ld.lld olddefconfig

          echo "===== Effective configuration ====="
          grep -E '^CONFIG_(MODULES|NAMESPACES|UTS_NS|PID_NS|SYSVIPC|IPC_NS|USER_NS|DEVTMPFS|DEVTMPFS_MOUNT|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS|KSU|KSU_SUSFS)=' out/.config || true

          echo "===== Disabled or missing options ====="
          for opt in MODULES NAMESPACES UTS_NS PID_NS SYSVIPC IPC_NS USER_NS DEVTMPFS KPROBES KPROBE_EVENTS KSU_KPROBE_HOOKS KSU; do
            if grep -q "^CONFIG_${opt}=y$" out/.config; then
              echo "OK: CONFIG_${opt}=y"
            else
              echo "MISSING: CONFIG_${opt}"
            fi
          done

          if ! grep -q '^CONFIG_PID_NS=y$' out/.config ||
             ! grep -q '^CONFIG_IPC_NS=y$'; then
            echo "ERROR: Required namespaces did not survive olddefconfig."
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU=y$' out/.config; then
            echo "ERROR: KernelSU is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_KPROBES=y$' out/.config ||
             ! grep -q '^CONFIG_KPROBE_EVENTS=y$' out/.config ||
             ! grep -q '^CONFIG_KSU_KPROBE_HOOKS=y$'; then
            echo "ERROR: Automatic KSU hooks are not fully configured."
            echo "Inspect the configuration output; do not flash this build."
            exit 1
          fi

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          export ARCH=arm64
          make -j"$(nproc)" O=out \
            CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: Verify build output
        run: |
          set -e
          find out/arch/arm64/boot -maxdepth 2 -type f \
            \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name 'dtbo.img' \) \
            -print
          test -s out/arch/arm64/boot/Image || {
            echo "ERROR: Kernel Image was not produced."
            exit 1
          }
          cp out/.config out/config-used.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agni-ns-kernel-diagnostics
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
            out/config-used.txt
            build.log
          if-no-files-found: warn
          
