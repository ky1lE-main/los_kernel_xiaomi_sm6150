
name: Diagnose Agni KernelSU Next Hooks

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Agni kernel source
        uses: actions/checkout@v4
        with:
          repository: manipvlator/los_kernel_xiaomi_sm6150
          ref: 54dde6839c08907860bdcc8b69eab72c75f17319
          path: kernel
          fetch-depth: 1

      - name: Checkout this repository for base config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: config-repo
          sparse-checkout: |
            agni_base.config.gz
          sparse-checkout-cone-mode: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            cpio zip curl xz-utils lld python3 git

      - name: Install Neutron Clang
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) --patch=glibc
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Copy config
        run: |
          set -e
          test -s config-repo/agni_base.config.gz
          gzip -t config-repo/agni_base.config.gz
          cp config-repo/agni_base.config.gz kernel/agni_base.config.gz

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          set -e
          curl -fsSL \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh legacy

          echo "===== KernelSU directories ====="
          ls -ld KernelSU-Next drivers/kernelsu

      - name: Configure and diagnose hooks
        working-directory: kernel
        shell: bash
        run: |
          set -e
          export ARCH=arm64
          export CC=clang
          export LD=ld.lld

          mkdir -p out
          zcat agni_base.config.gz > out/.config

          scripts/config --file out/.config \
            -e MODULES \
            -e NAMESPACES \
            -e UTS_NS \
            -e PID_NS \
            -e SYSVIPC \
            -e IPC_NS \
            -e USER_NS \
            -e DEVTMPFS \
            -e DEVTMPFS_MOUNT \
            -e KPROBES \
            -e KPROBE_EVENTS \
            -e KSU

          make O=out CC=clang LD=ld.lld olddefconfig

          echo "===== Effective config ====="
          grep -E '^(CONFIG_(KSU|KSU_[A-Z0-9_]*HOOK[A-Z0-9_]*|KPROBES|KPROBE_EVENTS|NAMESPACES|PID_NS|IPC_NS|USER_NS)=|# CONFIG_(KSU_[A-Z0-9_]*HOOK[A-Z0-9_]*|KPROBES|KPROBE_EVENTS) is not set)' out/.config || true

          echo "===== Hook references in Kbuild/Kconfig ====="
          grep -RniE 'No hooks were defined|KSU_KPROBE_HOOKS|KSU_WITH_KPROBES|KSU_MANUAL_HOOK|KPROBE_EVENTS|KPROBES' \
            drivers/kernelsu KernelSU-Next \
            --include='Kbuild' --include='Makefile' --include='Kconfig' \
            --include='*.mk' 2>/dev/null | head -200 || true

          echo "===== drivers/kernelsu/Kbuild lines 1-260 ====="
          if [ -f drivers/kernelsu/Kbuild ]; then
            sed -n '1,260p' drivers/kernelsu/Kbuild
          else
            echo "ERROR: drivers/kernelsu/Kbuild not found."
          fi

          echo "===== KernelSU Kconfig files ====="
          find drivers/kernelsu KernelSU-Next -name Kconfig -type f -print 2>/dev/null || true

          echo "===== Git status ====="
          git status --short

          echo "===== Diagnostic complete; intentionally not compiling ====="

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-hook-diagnostics
          path: |
            kernel/out/.config
            kernel/drivers/kernelsu/Kbuild
          if-no-files-found: warn
          
